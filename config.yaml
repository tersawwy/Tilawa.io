video:
  width: 1080
  height: 1920
  fps: 30
  duration: 58  # seconds to clip from YouTube

arabic:
  font: "assets/fonts/ScheherazadeNew-Regular.ttf"   # SIL Scheherazade New — full Uthmani mark support (alt: KFGQPC-Uthmanic-HAFS.otf)
  size: 90                   # word-pop base size (mushaf auto-fits, see render.text)

background:
  brightness: 0.78           # word-pop B-roll darkening
  blur: 10                   # --background video: blur strength (at 1/3 resolution)
  video_brightness: -0.14    # --background video: dimming
  video_sharp_intro: true    # --background video: sharp until recitation starts, then dissolve to blurred

sourcing:
  pexels_api_key: ""                # or PEXELS_API_KEY in .env / environment (nature footage)
  pixabay_api_key: ""               # or PIXABAY_API_KEY (word-pop B-roll fallback only)
  background_queries:
    - "cinematic forest path"
    - "ocean waves moody"
    - "mountains fog cinematic"
    - "rain on leaves macro"
    - "desert landscape golden"
    - "river flowing nature"
  clips_per_video: 8
  min_clip_width: 1920

output:
  aspect: "portrait"         # "portrait" (9:16, 1080×1920) or "landscape" (16:9, 1920×1080)

render:
  style: "mushaf"            # "mushaf" (whole ayah, default) or "word-pop" (legacy: one word at a time)
  background: "ambient"      # mushaf: "ambient" (Pexels footage if key set, else generative) or "video" (the YouTube video, softly blurred)
  theme: "auto"              # generative scene: night / dawn / emerald / auto (picked per surah)
  text:                      # mushaf ayah text (defaults in modules/ayah_layer.py)
    color: "#F4EEDD"         # warm ivory
    accent: "#D8B46A"        # muted gold — ayah marker + surah title
    max_size: 108            # font shrinks from here...
    min_size: 64             # ...to here, then long ayahs split into pages
  word_pop:
    fade_duration: 0.08      # seconds to fade in/out each word
    word_y_ratio_portrait: 0.45    # vertical center as fraction of H (portrait)
    word_y_ratio_landscape: 0.50   # vertical center as fraction of H (landscape)
    font_scale_landscape: 0.75     # multiply arabic.size by this in landscape mode

tiktok:
  cookies_file: "cookies/tiktok_cookies.txt"
  caption: "{surah_name_ar} | Surah {surah_name_en}"
  hashtags: "#quran #recitation #islam #peace #quranrecitation #fyp #foryoupage"
  privacy: "public"          # use "private" for test runs

sync:
  ctc_model: "jonatasgrosman/wav2vec2-large-xlsr-53-arabic"   # listens + aligns (keeps repeats)
  asr_model: "tarteel-ai/whisper-base-ar-quran"               # surah/ayah detection text
  search_margin_ayahs: 2         # ayahs searched either side of the detected range
  min_segment_confidence: -2.5   # mean CTC log-prob below this → fall back to heard timing
  # Locator costs (higher = less likely). Defaults live in quran_align.LocateConfig.
  repeat_cost: 1.5               # jumping back to repeat (whole or partial ayah)
  skip_cost: 0.8                 # per word skipped because the ASR missed it
  junk_enter: 1.2                # entering non-Quran speech (dua, talk, applause)
